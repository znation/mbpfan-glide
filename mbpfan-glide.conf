# mbpfan-glide configuration. Values shown are the defaults.
# Temperatures are in degrees C, speeds in rpm.

[general]
# Fans run at minimum speed at *_low and at maximum speed at *_high,
# linearly in between. The higher of the CPU and GPU demand wins.
# The CPU reading is the hottest core; the GPU reading is the junction
# (or edge) temperature from amdgpu, radeon or nouveau, if present.
cpu_low = 50
cpu_high = 70
gpu_low = 55
gpu_high = 75

# Weight of each new CPU sample in an exponential moving average
# (1 = no smoothing). Takes the edge off one-second spikes.
cpu_smoothing = 0.3

# How often to read sensors.
poll_seconds = 1

# After demand drops, hold the current speed this long, then descend
# at most this many rpm per second. Ramping up is always immediate.
hold_seconds = 30
down_rpm_per_second = 10

# Per-fan limits default to the SMC's fanN_min / fanN_max. Override with:
# min_fan1_speed = 1200
# max_fan1_speed = 2700
